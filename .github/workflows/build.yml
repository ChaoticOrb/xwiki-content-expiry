name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Policy tests
        run: python3 tests/run_policy_tests.py
      - name: Build XAR
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: content-expiry-xar
          path: dist/*.xar
